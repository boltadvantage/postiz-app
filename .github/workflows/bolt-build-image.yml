---
# Bolt Advantage: builds this fork into ghcr.io/<owner>/postiz-app for the Synology (amd64).
# Upstream's build-containers.yml pushes to gitroomhq and only runs on tags; this one runs on main.
name: "Bolt: Build Image"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'apps/extension/**'
      - 'apps/sdk/**'
      - 'apps/commands/**'

concurrency:
  group: bolt-build-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository != 'gitroomhq/postiz-app'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/postiz-app" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_VERSION=bolt-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
